<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEGETA777 🔥</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0c1017;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 25px auto;
    background: #1b222d;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #0008;
}

.server-status {
    background: #111820;
    border: 1px solid #168b48;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 22px;
}

.server-status h2 {
    color: #65a9ff;
    margin: 5px;
}

.server-status p {
    color: #28d66d;
    font-weight: bold;
    margin: 5px;
}

h1 {
    color: #ff9d00;
}

button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: #e64b20;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.yes {
    background: #168b48;
}

.no {
    background: #444d60;
}

iframe, video, img {
    width: 100%;
    border-radius: 10px;
    margin-top: 12px;
}

.hidden {
    display: none;
}

#mensaje {
    overflow-wrap: anywhere;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <!-- ESTADO DEL SERVIDOR -->
    <div class="server-status">
        <h2>NEXUS 444</h2>
        <p>🟢 STATUS ONLINE</p>
    </div>

    <!-- VIDEO -->
    <h1>VEGETA777 🔥</h1>
    <p>¡Disfruta del vídeo!</p>

    <iframe
        src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
        title="Vídeo de Vegetta777"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <button onclick="abrirYouTube()">
        Entrar en YouTube
    </button>

    <hr>

    <!-- PREGUNTA DE CÁMARA -->
    <section id="pregunta">
        <h3>¿Quieres abrir la cámara y tomar una foto?</h3>

        <button class="yes" onclick="abrirCamara()">
            Sí
        </button>

        <button class="no" onclick="cancelar()">
            No
        </button>
    </section>

    <!-- CÁMARA -->
    <section id="zonaCamara" class="hidden">
        <h3>Cámara activada</h3>

        <video id="video" autoplay playsinline></video>

        <button onclick="tomarFoto()">
            Tomar foto
        </button>

        <button class="no" onclick="cancelar()">
            Cancelar
        </button>
    </section>

    <!-- CONFIRMACIÓN DE ENVÍO -->
    <section id="revision" class="hidden">
        <h3>Vista previa de tu foto</h3>

        <img id="foto" alt="Vista previa de la fotografía">

        <h3>
            ¿Estás seguro de que quieres enviar esta foto a Discord?
        </h3>

        <button class="yes" id="botonEnviar" onclick="enviarDiscord()">
            Sí, enviar a Discord
        </button>

        <button class="no" onclick="cancelar()">
            No, cancelar
        </button>
    </section>

    <p id="mensaje" role="status" aria-live="polite"></p>

</div>

<script>
const SERVIDOR = "https://TU-SERVIDOR-PUBLICO";

const pregunta = document.getElementById("pregunta");
const zonaCamara = document.getElementById("zonaCamara");
const revision = document.getElementById("revision");

const video = document.getElementById("video");
const foto = document.getElementById("foto");
const mensaje = document.getElementById("mensaje");
const botonEnviar = document.getElementById("botonEnviar");

let stream = null;
let fotografia = null;

function abrirYouTube() {
    window.open(
        "https://www.youtube.com/@vegetta777",
        "_blank",
        "noopener,noreferrer"
    );
}

function mostrar(seccion) {
    pregunta.classList.add("hidden");
    zonaCamara.classList.add("hidden");
    revision.classList.add("hidden");

    seccion.classList.remove("hidden");
}

async function abrirCamara() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("La página necesita HTTPS.");
        }

        mensaje.textContent = "Solicitando permiso de cámara...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        mostrar(zonaCamara);
        mensaje.textContent = "Cámara activada.";

    } catch (error) {
        mensaje.textContent =
            "No se pudo abrir la cámara: " + error.message;
    }
}

function detenerCamara() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;
}

function tomarFoto() {
    if (!stream) return;

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(blob => {
        if (!blob) {
            mensaje.textContent = "No se pudo tomar la fotografía.";
            return;
        }

        fotografia = blob;

        if (foto.src.startsWith("blob:")) {
            URL.revokeObjectURL(foto.src);
        }

        foto.src = URL.createObjectURL(blob);

        detenerCamara();
        mostrar(revision);

        mensaje.textContent = "Revisa tu fotografía.";
    }, "image/jpeg", 0.9);
}

async function enviarDiscord() {
    if (!fotografia) return;

    botonEnviar.disabled = true;
    mensaje.textContent = "Enviando fotografía...";

    try {
        const datos = new FormData();

        datos.append(
            "archivos",
            fotografia,
            "foto.jpg"
        );

        const respuesta = await fetch(
            SERVIDOR + "/enviar",
            {
                method: "POST",
                body: datos
            }
        );

        if (!respuesta.ok) {
            throw new Error("Error del servidor: " + respuesta.status);
        }

        mensaje.textContent =
            "Fotografía enviada correctamente.";

        fotografia = null;

        if (foto.src.startsWith("blob:")) {
            URL.revokeObjectURL(foto.src);
        }

        foto.removeAttribute("src");
        mostrar(pregunta);

    } catch (error) {
        mensaje.textContent =
            "No se pudo enviar: " + error.message;

    } finally {
        botonEnviar.disabled = false;
    }
}

function cancelar() {
    detenerCamara();

    if (foto.src.startsWith("blob:")) {
        URL.revokeObjectURL(foto.src);
    }

    foto.removeAttribute("src");
    fotografia = null;

    mostrar(pregunta);

    mensaje.textContent = "Operación cancelada.";
}
</script>

</body>
</html>
