
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEGETA777 🔥</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 18px;
    background: #0c1017;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: #1b222d;
    border-radius: 15px;
}

.server-status {
    background: #111820;
    border: 1px solid #168b48;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 22px;
}

.server-status h2 { color: #65a9ff; }
#estado { font-weight: bold; color: #ffcc55; }
h1 { color: #ff9d00; }

button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 0;
    border-radius: 8px;
    background: #e64b20;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.yes { background: #168b48; }
.no { background: #444d60; }

iframe, video {
    width: 100%;
    border-radius: 10px;
    margin-top: 12px;
    border: 0;
}

.hidden { display: none; }

#mensaje {
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">

    <div class="server-status">
        <h2>NEXUS 444</h2>
        <p id="estado">🟡 SERVIDOR SIN CONFIGURAR</p>
    </div>

    <h1>VEGETA777 🔥</h1>
    <p>Disfruta del vídeo</p>

    <iframe
        src="https://www.youtube-nocookie.com/embed/videoseries?list=UUam8T03EOFBsNdR0thrFHdQ"
        title="Vídeos de Vegeta777"
        allowfullscreen>
    </iframe>

    <hr>

    <section id="pregunta">
        <h3>¿Quieres abrir la cámara y tomar una fotografía?</h3>
        <button class="yes" onclick="abrirCamara()">Sí, continuar</button>
        <button class="no" onclick="cancelar()">No</button>
    </section>

    <section id="zonaCamara" class="hidden">
        <h3>Cámara activada</h3>
        <p>Puedes tomar una fotografía cuando quieras.</p>
        <video id="video" autoplay playsinline></video>
        <button onclick="tomarFoto()">Tomar fotografía</button>
        <button class="no" onclick="cancelar()">Cancelar</button>
    </section>

    <section id="confirmacion" class="hidden">
        <h3>¿Estás seguro de que quieres enviar la fotografía?</h3>
        <p>Se enviará al servidor para guardarla.</p>
        <button class="yes" onclick="confirmarEnvio()">
            Sí, acepto enviar
        </button>
        <button class="no" onclick="cancelar()">
            No, cancelar
        </button>
    </section>

    <p id="mensaje" role="status" aria-live="polite"></p>
</div>

<script>
/*
  CONFIGURACIÓN:
  GitHub Pages aloja esta web.
  El backend Python necesita una dirección HTTPS independiente.
*/
const SERVIDOR = "";

const pregunta = document.getElementById("pregunta");
const zonaCamara = document.getElementById("zonaCamara");
const confirmacion = document.getElementById("confirmacion");
const video = document.getElementById("video");
const mensaje = document.getElementById("mensaje");
const estado = document.getElementById("estado");

let stream = null;
let fotografia = null;

function mostrar(seccion) {
    pregunta.classList.add("hidden");
    zonaCamara.classList.add("hidden");
    confirmacion.classList.add("hidden");
    seccion.classList.remove("hidden");
}

async function comprobarServidor() {
    if (!SERVIDOR) {
        estado.textContent = "🟡 FALTA CONFIGURAR EL BACKEND";
        return;
    }

    try {
        const respuesta = await fetch(
            SERVIDOR.replace(/\/+$/, "") + "/"
        );

        if (!respuesta.ok) throw new Error();

        const datos = await respuesta.json();
        estado.textContent = datos.status === "online"
            ? "🟢 SERVER ONLINE"
            : "🔴 SERVER OFFLINE";

    } catch {
        estado.textContent = "🔴 SERVER OFFLINE";
    }
}

comprobarServidor();

async function abrirCamara() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Se necesita HTTPS");
        }

        mensaje.textContent = "Solicitando permiso de cámara...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;
        mostrar(zonaCamara);
        mensaje.textContent = "Cámara activada.";

    } catch (error) {
        mensaje.textContent =
            "No se pudo abrir la cámara: " + error.message;
    }
}

function detenerCamara() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    video.srcObject = null;
}

function tomarFoto() {
    if (!stream || !video.videoWidth) {
        mensaje.textContent = "La cámara todavía no está preparada.";
        return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
        video, 0, 0, canvas.width, canvas.height
    );

    canvas.toBlob(blob => {
        if (!blob) {
            mensaje.textContent = "No se pudo tomar la fotografía.";
            return;
        }

        fotografia = blob;
        detenerCamara();
        mostrar(confirmacion);

        mensaje.textContent = "Fotografía tomada. Esperando confirmación.";
    }, "image/jpeg", 0.9);
}

function confirmarEnvio() {
    if (!fotografia) return;

    if (!SERVIDOR) {
        mensaje.textContent =
            "El servidor todavía no está configurado. No se ha enviado nada.";
        return;
    }

    mensaje.textContent =
        "Falta configurar y verificar el servicio de recepción.";
}

function cancelar() {
    detenerCamara();
    fotografia = null;
    mostrar(pregunta);
    mensaje.textContent = "Operación cancelada.";
}
</script>

</body>
</html>
